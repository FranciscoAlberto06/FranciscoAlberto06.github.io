<body>

    <div id="blazor-error-ui">
        Ha ocurrido un error inesperado.

        <a class="dismiss">🗙</a>
    </div>
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
              // ---- Duración mínima de la intro ----
              // Cambia este número (en milisegundos) para que la intro dure más o menos.
              // 2200 = 2.2 segundos mínimo, aunque la app cargue antes.
              const MIN_INTRO_MS = 2200;

              const startTime = Date.now();

              Blazor.start().then(function () {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, MIN_INTRO_MS - elapsed);

                setTimeout(function () {
                  const overlay = document.getElementById('boot-overlay');
                  if (overlay) {
                    overlay.classList.add('boot-overlay-hide');
                    setTimeout(function () { overlay.remove(); }, 400); // tras el fundido
                  }
                }, remaining);
              });
    </script>
